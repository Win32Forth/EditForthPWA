<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EditForthPWA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
      color: #111111;
      font: 15px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #d0d0d0;
    }
    header h1 { font-size: 16px; font-weight: 600; margin: 0; }
    #app-menu { position: relative; flex: none; }
    #menu-btn {
      width: 36px;
      height: 32px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #menu-btn span {
      display: block;
      width: 16px;
      height: 2px;
      background: #111111;
      border-radius: 1px;
    }
    #menu-btn:hover,
    #menu-btn[aria-expanded="true"] { background: #f3f3f3; }
    #menu-panel {
      position: absolute;
      z-index: 6;
      top: calc(100% + 6px);
      left: 0;
      width: max-content;
      min-width: 180px;
      padding: 6px;
      background: #ffffff;
      border: 1px solid #b0b0b0;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(17, 17, 17, 0.12);
    }
    #menu-panel[hidden] { display: none; }
    #menu-panel button {
      display: block;
      width: 100%;
      white-space: nowrap;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #menu-panel button:hover { background: #f3f3f3; }
    #where, #folder {
      color: #444444;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    #folder:empty { display: none; }
    .spacer { flex: 1; }
    button, input {
      font: inherit;
      color: inherit;
    }
    header button, .tools button {
      background: #ffffff;
      border: 1px solid #b0b0b0;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button.primary { background: #111111; color: #ffffff; }
    button[hidden], form[hidden] { display: none; }
    #workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
    }
    #tree {
      width: 220px;
      flex: none;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    #tree-split {
      flex: none;
      width: 18px;
      cursor: ew-resize;
      touch-action: none;
      user-select: none;
      background: #e4e4e4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #tree-split::before {
      content: "";
      width: 3px;
      height: 100%;
      background: #8e8e8e;
    }
    #tree-split:hover,
    body.resizing-x #tree-split { background: #d4d4d4; }
    body.resizing-x, body.resizing-x * {
      cursor: ew-resize;
      user-select: none;
    }
    #main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
      border-bottom: 1px solid #d0d0d0;
    }
    #name-form { padding: 8px; border-bottom: 1px solid #d0d0d0; }
    #name-input {
      width: 100%;
      box-sizing: border-box;
      background: #ffffff;
      color: #111111;
      border: 1px solid #b0b0b0;
      border-radius: 6px;
      padding: 6px 8px;
    }
    #listing {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 6px;
    }
    #listing button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      border: 0;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
    }
    #listing button.active { background: #e8e8e8; }
    #listing .dir { color: #444444; padding: 4px 8px; }
    #edit {
      flex: 1;
      min-width: 0;
      min-height: 120px;
      display: flex;
      flex-direction: column;
    }
    #tabs {
      flex: none;
      display: flex;
      overflow-x: auto;
      background: #f3f3f3;
      border-bottom: 1px solid #d0d0d0;
    }
    #tabs:empty { display: none; }
    .tab {
      display: flex;
      align-items: stretch;
      flex: none;
      border-right: 1px solid #d0d0d0;
      background: #f3f3f3;
    }
    .tab.active { background: #ffffff; }
    .tab-name, .tab-close {
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 6px 8px;
    }
    .tab-close { padding-left: 0; color: #444444; }
    #banner {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: #fff3b0;
      color: #111111;
      border-bottom: 1px solid #e6d48a;
      font-size: 13px;
    }
    #banner[hidden] { display: none; }
    #banner .spacer { flex: 1; }
    #banner button {
      background: #ffffff;
      border: 1px solid #b0b0b0;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #editor-row {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
    }
    #editor-pane {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
    }
    #hl {
      display: none;
      position: absolute;
      inset: 0;
      margin: 0;
      overflow: hidden;
      pointer-events: none;
      white-space: pre;
      color: #111111;
      background: #ffffff;
      padding: 12px 14px;
      line-height: 21px;
      font: inherit;
    }
    #editor-pane.debugging #hl { display: block; }
    #editor-pane.debugging #editor {
      background: transparent;
      color: transparent;
    }
    #hl mark {
      background: rgba(52, 199, 89, 0.35);
      color: #111111;
    }
    #gutter {
      flex: none;
      overflow: hidden;
      align-self: stretch;
      background: #f7f7f7;
      border-right: 1px solid #e4e4e4;
      color: #6a6a6a;
    }
    #gutter-inner {
      position: relative;
      padding: 12px 8px 12px 10px;
    }
    #gutter-nums {
      margin: 0;
      position: relative;
      z-index: 1;
      text-align: right;
      line-height: 21px;
      font: inherit;
    }
    #gutter-mark {
      position: absolute;
      left: 0;
      right: 0;
      height: 21px;
      background: #f4d4d4;
      z-index: 0;
    }
    #gutter-mark[hidden] { display: none; }
    #split {
      flex: none;
      height: 18px;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
      background: #e4e4e4;
      display: flex;
      align-items: center;
    }
    #split::before {
      content: "";
      height: 3px;
      width: 100%;
      background: #8e8e8e;
    }
    #split:hover,
    body.resizing #split { background: #d4d4d4; }
    body.resizing, body.resizing * {
      cursor: ns-resize;
      user-select: none;
    }
    #editor {
      flex: 1;
      min-width: 0;
      border: 0;
      resize: none;
      outline: none;
      background: #ffffff;
      color: #111111;
      padding: 12px 14px;
      line-height: 21px;
      white-space: pre;
    }
    #editor[readonly] {
      background: #ffffff;
      color: #111111;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    #save-ask {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(17, 17, 17, 0.25);
    }
    #save-ask[hidden] { display: none; }
    #save-ask .card {
      max-width: 440px;
      background: #ffffff;
      color: #111111;
      border: 1px solid #b0b0b0;
      border-radius: 8px;
      padding: 16px;
    }
    #save-ask p { margin: 0 0 14px; }
    #save-ask .choices { display: flex; gap: 8px; justify-content: flex-end; }
    #console {
      flex: none;
      height: 190px;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    #log {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 8px 12px;
      white-space: pre-wrap;
      word-break: break-word;
      outline: none;
      caret-color: #111111;
    }
    .err { color: #9b1c1c; }
    @media (max-width: 700px) {
      #workspace { flex-direction: column; }
      #tree {
        width: auto !important;
        height: 150px;
        border-bottom: 1px solid #d0d0d0;
      }
      #tree-split { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div id="app-menu">
      <button id="menu-btn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel" title="Menu">
        <span></span><span></span><span></span>
      </button>
      <div id="menu-panel" role="menu" hidden>
        <button id="open-folder" type="button" role="menuitem">Open Folder</button>
        <button id="show-boot" type="button" role="menuitem">Show boot messages</button>
      </div>
    </div>
    <h1>EditForth</h1>
    <span id="folder"></span>
    <span id="where"></span>
    <span class="spacer"></span>
    <button id="load" class="primary" type="button" title="Include this file (Cmd+Enter or Ctrl+Enter)">Include</button>
    <button id="restart" type="button" title="Fresh image">Restart</button>
    <button id="install" hidden type="button">Install</button>
  </header>
  <div id="workspace">
    <aside id="tree">
      <div class="tools">
        <button id="new-file" type="button">New</button>
        <button id="close-file" type="button" title="Close this tab. You choose whether to save.">Close</button>
        <button id="save" type="button" title="Save this file. A new file asks for a name. (Cmd+S or Ctrl+S)" disabled>Save</button>
      </div>
      <form id="name-form" hidden>
        <input id="name-input" placeholder="Save as name.fth or lib/name.fth" aria-label="Save as" autocomplete="off" spellcheck="false">
      </form>
      <div id="listing"></div>
    </aside>
    <div id="tree-split" role="separator" aria-orientation="vertical" aria-label="Resize file list" aria-controls="tree" tabindex="0" title="Drag to resize the file list"></div>
    <div id="main">
      <section id="edit">
        <div id="tabs"></div>
        <div id="banner" hidden>
          <strong>View mode</strong>
          <span>Read-only — typing asks to switch to Edit</span>
          <span class="spacer"></span>
          <button id="leave-view" type="button">Edit</button>
        </div>
        <div id="editor-row">
          <div id="gutter" aria-hidden="true"><div id="gutter-inner"><div id="gutter-mark" hidden></div><pre id="gutter-nums"></pre></div></div>
          <div id="editor-pane">
            <pre id="hl" aria-hidden="true"></pre>
            <textarea id="editor" wrap="off" spellcheck="false" autocomplete="off" aria-label="Forth source"></textarea>
          </div>
        </div>
      </section>
      <div id="split" role="separator" aria-orientation="horizontal" aria-label="Resize console" aria-controls="console" tabindex="0" title="Drag to resize the console"></div>
      <section id="console">
        <div id="log" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off" role="textbox" aria-multiline="true" aria-label="Forth console"></div>
      </section>
    </div>
  </div>
  <div id="save-ask" hidden>
    <div class="card">
      <p id="save-ask-text"></p>
      <div class="choices">
        <button type="button" data-choice="save">Save</button>
        <button type="button" data-choice="discard">Don't Save</button>
        <button type="button" data-choice="cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script type="module" src="app.js?v=38"></script>
</body>
</html>
